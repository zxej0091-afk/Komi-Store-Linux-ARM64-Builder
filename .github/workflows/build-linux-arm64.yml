name: Build Linux ARM64 DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Build ARM64 DEB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :composeApp:packageDeb

      - name: Verify architecture
        run: |
          for f in composeApp/build/compose/binaries/main/deb/*.deb; do
            dpkg-deb -f "$f" Architecture
            test "$(dpkg-deb -f "$f" Architecture)" = arm64
          done

      - uses: actions/upload-artifact@v4
        with:
          name: komi-store-linux-arm64-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 30